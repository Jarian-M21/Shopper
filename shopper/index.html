<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shopper</title>
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0;
    background: #f4f1ea;
    color: #1a1a1a;
    font-family: system-ui, sans-serif;
  }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .accent {
    height: 4px;
    background: #00356b;
    flex: none;
  }
  .page {
    flex: 1;
    display: flex;
    flex-direction: column;
    width: 100%;
    padding: 8px 14px 6px;
  }
  header {
    padding-bottom: 6px;
    margin-bottom: 6px;
    border-bottom: 1px solid #1a1a1a;
  }
  .title-row {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 8px 16px;
  }
  h1 {
    margin: 0;
    font-family: Palatino, Georgia, serif;
    font-weight: normal;
    font-size: 2rem;
    line-height: 0.95;
    letter-spacing: -0.03em;
  }
  .subtitle {
    margin: 4px 0 0;
    font-size: 0.95rem;
    line-height: 1.35;
  }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  button { font: inherit; cursor: pointer; }
  .primary, .ghost {
    font-size: clamp(0.9rem, 0.84rem + 0.15vw, 1.02rem);
    padding: 0.45rem 0.9rem;
    border-radius: 4px;
  }
  .primary {
    background: #00356b;
    color: #fff;
    border: 1px solid #00356b;
    font-weight: 600;
  }
  .ghost {
    background: #fff;
    color: #1a1a1a;
    border: 1px solid #d9d3c7;
  }
  .layout {
    display: flex;
    flex-direction: column;
    gap: clamp(12px, 1.4vw, 22px);
    min-width: 0;
  }
  .panel-title, .week h2 {
    font-family: Palatino, Georgia, serif;
    font-weight: normal;
  }
  .panel-title, .week h2 {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .panel-title {
    margin: 0 0 6px;
    font-size: 1.25rem;
    line-height: 1;
  }
  .panel-title::after, .week h2::after {
    content: "";
    flex: 1;
    height: 1px;
    background: #d9d3c7;
  }
  .course-list { display: flex; flex-direction: column; gap: 6px; }
  .course {
    display: flex;
    gap: 8px;
    align-items: flex-start;
    background: #fff;
    border: 1px solid #d9d3c7;
    padding: 7px 8px;
    line-height: 1.3;
    font-size: clamp(0.86rem, 0.8rem + 0.15vw, 0.98rem);
  }
  .course.off { opacity: 0.48; }
  .course input {
    margin: 3px 0 0;
    flex: none;
    accent-color: #00356b;
  }
  .swatch {
    width: 8px;
    align-self: stretch;
    flex: none;
    border-radius: 1px;
  }
  .course .code { color: #00356b; font-weight: 600; white-space: nowrap; }
  .course .when {
    display: block;
    margin-top: 2px;
    font-size: 0.92em;
  }
  .main { min-width: 0; }
  .status {
    margin: 0 0 4px;
    font-size: 0.95rem;
    line-height: 1.3;
  }
  .weeks {
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 0;
  }
  .week { min-width: 0; }
  .week h2 {
    margin: 0 0 5px;
    font-size: 1.35rem;
    line-height: 1;
    color: #00356b;
  }
  .days {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 8.5rem), 1fr));
    gap: 6px;
    min-width: 0;
  }
  .day {
    display: flex;
    flex-direction: column;
    background: #fff;
    border: 1px solid #d9d3c7;
    border-top: 3px solid #00356b;
  }
  .day-name {
    margin: 0;
    padding: 4px 8px 3px;
    border-bottom: 1px solid #d9d3c7;
    background: rgba(0, 53, 107, 0.06);
    color: #00356b;
    font-family: Palatino, Georgia, serif;
    font-size: 15px;
    line-height: 1.2;
    white-space: nowrap;
  }
  .block {
    display: block;
    width: auto;
    margin: 3px 5px 0;
    padding: 4px 7px;
    border: 1px solid rgba(26, 26, 26, 0.16);
    border-radius: 3px;
    text-align: left;
    font: inherit;
    font-size: 13px;
    line-height: 1.25;
    font-variant-numeric: tabular-nums;
    color: #1a1a1a;
    cursor: pointer;
  }
  .day .block:last-child { margin-bottom: 3px; }
  .block .time,
  .block .code,
  .block .place {
    display: block;
    white-space: nowrap;
  }
  .block .code { color: #00356b; font-weight: 700; }
  .block.selected {
    border-color: #1a1a1a;
    outline: 1px solid #1a1a1a;
    outline-offset: 1px;
  }
  .open {
    margin: 8px;
    font-size: 0.86rem;
    color: #8a8478;
  }
  .entrance {
    margin: 10px 0 0;
    background: #fff;
    border: 1px solid #d9d3c7;
    border-left: 4px solid #00356b;
    padding: 8px 12px;
    font-size: clamp(0.9rem, 0.84rem + 0.15vw, 1.02rem);
    line-height: 1.4;
  }
  .cards {
    margin-top: 6px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 24rem), 1fr));
    gap: 8px;
    align-items: start;
  }
  .card {
    background: #fff;
    border: 1px solid #d9d3c7;
    border-left-width: 4px;
    border-radius: 4px;
    min-width: 0;
  }
  .card h3 {
    margin: 0;
    padding: 4px 10px;
    border-bottom: 1px solid #d9d3c7;
    font-family: Palatino, Georgia, serif;
    font-size: 1.05rem;
    font-weight: normal;
    line-height: 1.2;
  }
  .card p {
    margin: 0;
    padding: 5px 10px 0;
    font-size: 0.9rem;
    line-height: 1.35;
  }
  .card p:last-child { padding-bottom: 7px; }
  .card.bad {
    border-color: #9f2d20;
    color: #9f2d20;
  }
  .card.bad h3 { background: rgba(159, 45, 32, 0.08); }
  .card.good {
    border-color: #24574a;
    color: #24574a;
  }
  .card.good h3 { background: rgba(36, 87, 74, 0.1); }
  footer {
    margin-top: auto;
    padding-top: 6px;
    border-top: 1px solid #d9d3c7;
    font-size: 0.8rem;
    line-height: 1.35;
  }
  @media (min-width: 1040px) {
    .layout {
      flex-direction: row;
      align-items: flex-start;
    }
    .courses {
      width: clamp(228px, 18vw, 340px);
      flex: none;
    }
    .main { flex: 1; }
  }
  @media (min-width: 800px) {
    .days { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  }
  @media (min-width: 1500px) {
    .page { padding: 12px 32px 8px; }
    h1 { font-size: 2.7rem; }
    .subtitle { font-size: 1.05rem; }
    .week h2 { font-size: 1.55rem; }
    .days { gap: 12px; }
    .day-name { font-size: 17px; padding: 5px 10px 4px; }
    .block { font-size: 14.5px; padding: 5px 9px; margin: 4px 6px 0; }
    .day .block:last-child { margin-bottom: 4px; }
    .card h3 { font-size: 1.15rem; }
    .card p { font-size: 0.98rem; }
    .status { font-size: 1.02rem; }
    footer { font-size: 0.9rem; }
  }
  @media (min-width: 1900px) {
    .page { padding: 22px 40px 16px; }
    h1 { font-size: 3.45rem; }
    .week h2 { font-size: 1.9rem; }
    .days { gap: 16px; }
    .day-name { font-size: 22px; padding: 8px 12px 7px; }
    .block { font-size: 17px; padding: 8px 12px; }
    .card p { font-size: 1.08rem; }
  }
</style>
</head>
<body>
  <div class="accent" aria-hidden="true"></div>
  <div class="page">
    <header>
      <div class="title-row">
        <h1>Shopper</h1>
        <div class="actions">
          <button type="button" class="primary" id="plan-btn">Plan my shopping</button>
          <button type="button" class="ghost" id="reset-btn">Reset</button>
        </div>
      </div>
      <p class="subtitle">A two-week route into every class you are shopping. Back-to-backs that the walk makes impossible are marked.</p>
    </header>
    <div class="layout">
      <aside class="courses">
        <h2 class="panel-title">Classes</h2>
        <div class="course-list" id="courses"></div>
      </aside>
      <div class="main">
        <p class="status" id="status">Pick the classes you might take, then plan the two weeks.</p>
        <div class="weeks" id="weeks"></div>
        <p class="entrance" id="entrance" hidden></p>
        <div class="cards" id="cards"></div>
      </div>
    </div>
    <footer>Demo roster. Times follow Yale College standard meeting patterns. Walks are on foot, with no shuttle.</footer>
  </div>
<script>
(function () {
  var BUILDINGS = {
    SCL: {
      name: "Sterling Chemistry Laboratory",
      cluster: "science-hill",
      entrance: "225 Prospect. Use the Prospect Street doors. The room is on the first floor."
    },
    SPL: {
      name: "Sloane Physics Laboratory",
      cluster: "science-hill",
      entrance: "Science Hill. Use the main entrance facing the walk."
    },
    WLH: {
      name: "William L. Harkness Hall",
      cluster: "cross-campus",
      entrance: "100 Wall Street. This building is the Whale. The room is one floor up from the Wall Street doors."
    },
    AKW: {
      name: "Arthur K. Watson Hall",
      cluster: "hillhouse",
      entrance: "51 Prospect Street. The room is on the second floor."
    },
    HQ: {
      name: "Humanities Quadrangle",
      cluster: "hq",
      entrance: "320 York Street. Enter from York Street. Second-floor room numbers do not follow the street you came in from."
    },
    LC: {
      name: "Linsly-Chittenden Hall",
      cluster: "high-street",
      entrance: "63 High Street. The room is on the second floor, off the High Street entrance."
    }
  };

  var WALKS = {
    "cross-campus|high-street": 6,
    "cross-campus|hillhouse": 10,
    "cross-campus|hq": 8,
    "cross-campus|science-hill": 16,
    "high-street|hillhouse": 12,
    "high-street|hq": 8,
    "high-street|science-hill": 18,
    "hillhouse|hq": 12,
    "hillhouse|science-hill": 12,
    "hq|science-hill": 22
  };

  var COURSES = [
    { code: "PHYS 180", title: "University Physics", color: "#d5e6e4", days: ["Tue", "Thu"], start: 540, end: 615, building: "SPL", room: "59" },
    { code: "ECON 115", title: "Introductory Microeconomics", color: "#dcead7", days: ["Tue", "Thu"], start: 695, end: 770, building: "WLH", room: "207" },
    { code: "CPSC 201", title: "Introduction to Computer Science", color: "#f7e7c6", days: ["Tue", "Thu"], start: 785, end: 860, building: "AKW", room: "200" },
    { code: "CHEM 161", title: "General Chemistry I", color: "#d9e4f5", days: ["Mon", "Wed", "Fri"], start: 810, end: 860, building: "SCL", room: "110" },
    { code: "ENGL 129", title: "The Modern Essay", color: "#f3d6cf", days: ["Mon", "Wed", "Fri"], start: 875, end: 925, building: "HQ", room: "241" },
    { code: "PHIL 180", title: "Problems of Philosophy", color: "#e7e0f2", days: ["Wed"], start: 810, end: 925, building: "LC", room: "205" }
  ];

  var DAYS = ["Mon1", "Tue1", "Wed1", "Thu1", "Fri1", "Mon2", "Tue2", "Wed2", "Thu2", "Fri2"];
  var WEEKDAYS = ["Mon", "Tue", "Wed", "Thu", "Fri"];
  var PLURAL = {
    Mon: "Mondays",
    Tue: "Tuesdays",
    Wed: "Wednesdays",
    Thu: "Thursdays",
    Fri: "Fridays"
  };
  var SINGULAR = {
    Mon: "Monday",
    Tue: "Tuesday",
    Wed: "Wednesday",
    Thu: "Thursday",
    Fri: "Friday"
  };

  var checked = {};
  var planned = false;
  var activeKey = null;
  COURSES.forEach(function (course) { checked[course.code] = true; });

  var coursesEl = document.getElementById("courses");
  var statusEl = document.getElementById("status");
  var weeksEl = document.getElementById("weeks");
  var entranceEl = document.getElementById("entrance");
  var cardsEl = document.getElementById("cards");

  function walk(a, b) {
    if (a === b) return 0;
    var ca = BUILDINGS[a].cluster;
    var cb = BUILDINGS[b].cluster;
    if (ca === cb) return 4;
    var key = ca < cb ? ca + "|" + cb : cb + "|" + ca;
    return WALKS[key];
  }

  function formatTime(mins) {
    var h = Math.floor(mins / 60);
    var m = mins % 60;
    if (h === 0) h = 12;
    else if (h > 12) h = h - 12;
    return h + ":" + (m < 10 ? "0" + m : String(m));
  }

  function formatRange(start, end) {
    return formatTime(start) + "\u2013" + formatTime(end);
  }

  function formatDays(days) {
    if (days.length === 1) return days[0];
    if (days.length === 2) return days[0] + " and " + days[1];
    return days.slice(0, -1).join(", ") + ", and " + days[days.length - 1];
  }

  function joinNames(names) {
    if (!names.length) return "";
    if (names.length === 1) return names[0];
    if (names.length === 2) return names[0] + " and " + names[1];
    return names.slice(0, -1).join(", ") + ", and " + names[names.length - 1];
  }

  function weekdayOf(day) {
    return day.slice(0, 3);
  }

  function courseIndex(code) {
    for (var i = 0; i < COURSES.length; i++) {
      if (COURSES[i].code === code) return i;
    }
    return COURSES.length;
  }

  function selectedCourses() {
    return COURSES.filter(function (course) { return checked[course.code]; });
  }

  function sessionFrom(course, day) {
    return {
      code: course.code,
      color: course.color,
      day: day,
      start: course.start,
      end: course.end,
      building: course.building,
      room: course.room
    };
  }

  function expand(selected) {
    var sessions = [];
    selected.forEach(function (course) {
      DAYS.forEach(function (day) {
        if (course.days.indexOf(weekdayOf(day)) === -1) return;
        sessions.push(sessionFrom(course, day));
      });
    });
    return sessions;
  }

  function remainingCount(code, dayIndex, sessions) {
    var n = 0;
    for (var i = 0; i < sessions.length; i++) {
      if (sessions[i].code === code && DAYS.indexOf(sessions[i].day) >= dayIndex) n++;
    }
    return n;
  }

  function seenRank(count) {
    if (count === 0) return 0;
    if (count === 1) return 1;
    return 2;
  }

  function overlaps(a, b) {
    return a.start < b.end && b.start < a.end;
  }

  function gapMinutes(a, b) {
    if (a.end <= b.start) return b.start - a.end;
    if (b.end <= a.start) return a.start - b.end;
    return null;
  }

  function sharesWeekday(a, b) {
    for (var i = 0; i < a.days.length; i++) {
      if (b.days.indexOf(a.days[i]) !== -1) return true;
    }
    return false;
  }

  function coursesConflict(a, b) {
    if (!sharesWeekday(a, b)) return false;
    if (overlaps(a, b)) return true;
    var gap = gapMinutes(a, b);
    if (gap === null) return false;
    return gap < walk(a.building, b.building);
  }

  function conflictSet(selected) {
    var set = {};
    for (var i = 0; i < selected.length; i++) {
      for (var j = i + 1; j < selected.length; j++) {
        if (!coursesConflict(selected[i], selected[j])) continue;
        set[selected[i].code] = true;
        set[selected[j].code] = true;
      }
    }
    return set;
  }

  function fits(chosen, session) {
    for (var i = 0; i < chosen.length; i++) {
      var other = chosen[i];
      if (overlaps(session, other)) return false;
      if (session.end <= other.start && other.start - session.end < walk(session.building, other.building)) return false;
      if (other.end <= session.start && session.start - other.end < walk(other.building, session.building)) return false;
    }
    return true;
  }

  function byStart(a, b) {
    if (a.start !== b.start) return a.start - b.start;
    if (a.code < b.code) return -1;
    if (a.code > b.code) return 1;
    return 0;
  }

  function buildPlan(selected) {
    var conflicts = conflictSet(selected);
    var contested = selected.filter(function (course) { return conflicts[course.code]; });
    var calm = selected.filter(function (course) { return !conflicts[course.code]; });
    var sessions = expand(contested);
    var visited = {};
    contested.forEach(function (course) { visited[course.code] = 0; });
    var result = {};
    DAYS.forEach(function (day) { result[day] = []; });

    calm.forEach(function (course) {
      DAYS.forEach(function (day) {
        if (course.days.indexOf(weekdayOf(day)) === -1) return;
        result[day].push(sessionFrom(course, day));
      });
    });

    DAYS.forEach(function (day, dayIndex) {
      var candidates = sessions.filter(function (session) { return session.day === day; });
      var chosen = result[day].slice();
      while (candidates.length) {
        candidates.sort(function (a, b) {
          var rank = seenRank(visited[a.code]) - seenRank(visited[b.code]);
          if (rank !== 0) return rank;
          var remain = remainingCount(a.code, dayIndex, sessions) - remainingCount(b.code, dayIndex, sessions);
          if (remain !== 0) return remain;
          if (a.start !== b.start) return a.start - b.start;
          if (a.code < b.code) return -1;
          if (a.code > b.code) return 1;
          return 0;
        });
        var candidate = candidates.shift();
        if (fits(chosen, candidate)) {
          chosen.push(candidate);
          visited[candidate.code]++;
        }
      }
      chosen.sort(byStart);
      result[day] = chosen;
    });
    return result;
  }

  function gapInfo(a, b) {
    if (overlaps(a, b)) return { overlap: true };
    if (a.end <= b.start) {
      return { overlap: false, first: a, second: b, gap: b.start - a.end };
    }
    if (b.end <= a.start) {
      return { overlap: false, first: b, second: a, gap: a.start - b.end };
    }
    return { overlap: false, gap: null };
  }

  function pairsForWeekday(courses, weekday) {
    var meeting = courses.filter(function (course) {
      return course.days.indexOf(weekday) !== -1;
    });
    var pairs = [];
    for (var i = 0; i < meeting.length; i++) {
      for (var j = i + 1; j < meeting.length; j++) pairs.push([meeting[i], meeting[j]]);
    }
    return pairs;
  }

  function appearsOn(plan, code, weekday) {
    for (var i = 0; i < DAYS.length; i++) {
      if (weekdayOf(DAYS[i]) !== weekday) continue;
      var sessions = plan[DAYS[i]];
      for (var s = 0; s < sessions.length; s++) {
        if (sessions[s].code === code) return true;
      }
    }
    return false;
  }

  function scheduledNames(plan, code) {
    var names = [];
    WEEKDAYS.forEach(function (weekday) {
      if (appearsOn(plan, code, weekday)) names.push(PLURAL[weekday]);
    });
    return names;
  }

  function planSentence(plan, codeA, codeB) {
    var aDays = scheduledNames(plan, codeA);
    var bDays = scheduledNames(plan, codeB);
    var aHalf = aDays.length ? "puts " + codeA + " on " + joinNames(aDays) : "does not get you into " + codeA;
    var bHalf = bDays.length ? codeB + " on " + joinNames(bDays) : "does not get you into " + codeB;
    return "The plan " + aHalf + " and " + bHalf + ".";
  }

  function keptCourse(plan, weekday, a, b) {
    var aOn = appearsOn(plan, a.code, weekday);
    var bOn = appearsOn(plan, b.code, weekday);
    if (aOn && !bOn) return a.code;
    if (bOn && !aOn) return b.code;
    return a.code;
  }

  function week1Complete(selected, plan) {
    return selected.every(function (course) {
      return DAYS.some(function (day) {
        if (day.charAt(day.length - 1) !== "1") return false;
        return plan[day].some(function (session) { return session.code === course.code; });
      });
    });
  }

  function unseenCourses(selected, plan) {
    return selected.filter(function (course) {
      return !DAYS.some(function (day) {
        return plan[day].some(function (session) { return session.code === course.code; });
      });
    });
  }

  function clearEntrance() {
    activeKey = null;
    entranceEl.hidden = true;
    entranceEl.textContent = "";
  }

  function renderCourses() {
    coursesEl.innerHTML = "";
    COURSES.forEach(function (course) {
      var label = document.createElement("label");
      label.className = "course" + (checked[course.code] ? "" : " off");
      var input = document.createElement("input");
      input.type = "checkbox";
      input.checked = checked[course.code];
      input.addEventListener("change", function () {
        checked[course.code] = input.checked;
        label.className = "course" + (input.checked ? "" : " off");
        if (planned) showPlan();
      });
      var swatch = document.createElement("span");
      swatch.className = "swatch";
      swatch.style.background = course.color;
      var info = document.createElement("span");
      var line1 = document.createElement("span");
      var code = document.createElement("span");
      code.className = "code";
      code.textContent = course.code;
      line1.appendChild(code);
      line1.appendChild(document.createTextNode(" " + course.title));
      var line2 = document.createElement("span");
      line2.className = "when";
      line2.textContent = formatDays(course.days) + ", " + formatRange(course.start, course.end) + ", " + course.building + " " + course.room;
      info.appendChild(line1);
      info.appendChild(line2);
      label.appendChild(input);
      label.appendChild(swatch);
      label.appendChild(info);
      coursesEl.appendChild(label);
    });
  }

  function renderWeeks(plan) {
    weeksEl.innerHTML = "";
    [1, 2].forEach(function (week) {
      var section = document.createElement("section");
      section.className = "week";
      var heading = document.createElement("h2");
      heading.textContent = "Week " + week;
      section.appendChild(heading);
      var days = document.createElement("div");
      days.className = "days";
      WEEKDAYS.forEach(function (weekday) {
        var col = document.createElement("div");
        col.className = "day";
        var name = document.createElement("div");
        name.className = "day-name";
        name.textContent = SINGULAR[weekday];
        col.appendChild(name);
        var sessions = plan[weekday + week];
        if (!sessions.length) {
          var open = document.createElement("div");
          open.className = "open";
          open.textContent = "Open";
          col.appendChild(open);
        }
        sessions.forEach(function (session) {
          var block = document.createElement("button");
          block.type = "button";
          block.className = "block";
          block.style.background = session.color;
          var when = document.createElement("span");
          when.className = "time";
          when.textContent = formatRange(session.start, session.end);
          var code = document.createElement("span");
          code.className = "code";
          code.textContent = session.code;
          var where = document.createElement("span");
          where.className = "place";
          where.textContent = session.building + " " + session.room;
          block.appendChild(when);
          block.appendChild(code);
          block.appendChild(where);
          var key = session.day + "|" + session.code;
          block.addEventListener("click", function () {
            if (activeKey === key) {
              clearEntrance();
              block.classList.remove("selected");
              return;
            }
            var selected = weeksEl.querySelectorAll(".block.selected");
            for (var i = 0; i < selected.length; i++) selected[i].classList.remove("selected");
            activeKey = key;
            block.classList.add("selected");
            entranceEl.hidden = false;
            entranceEl.textContent = BUILDINGS[session.building].entrance;
          });
          col.appendChild(block);
        });
        days.appendChild(col);
      });
      section.appendChild(days);
      weeksEl.appendChild(section);
    });
  }

  function addText(parent, text) {
    var p = document.createElement("p");
    p.textContent = text;
    parent.appendChild(p);
  }

  function pairKey(a, b) {
    return a < b ? a + "|" + b : b + "|" + a;
  }

  function walkBetween(a, b) {
    var info = gapInfo(a, b);
    if (info.overlap || info.gap === null) return null;
    var minutes = walk(info.first.building, info.second.building);
    return { info: info, minutes: minutes, slack: info.gap - minutes };
  }

  function fittingDayNames(a, b) {
    var names = [];
    WEEKDAYS.forEach(function (weekday) {
      if (a.days.indexOf(weekday) === -1 || b.days.indexOf(weekday) === -1) return;
      var between = walkBetween(a, b);
      if (!between || between.slack < 0) return;
      names.push(PLURAL[weekday]);
    });
    return names;
  }

  function overlapLines(selected, plan, weekday) {
    var pairs = pairsForWeekday(selected, weekday).filter(function (pair) {
      return overlaps(pair[0], pair[1]);
    });
    if (!pairs.length) return [];

    var parent = {};
    function find(code) {
      var root = code;
      while (parent[root] !== root) root = parent[root];
      return root;
    }
    function unite(a, b) {
      if (!parent[a]) parent[a] = a;
      if (!parent[b]) parent[b] = b;
      var ra = find(a);
      var rb = find(b);
      if (ra !== rb) parent[ra] = rb;
    }
    pairs.forEach(function (pair) { unite(pair[0].code, pair[1].code); });

    var groups = {};
    Object.keys(parent).forEach(function (code) {
      var root = find(code);
      if (!groups[root]) groups[root] = [];
      groups[root].push(code);
    });

    var lines = [];
    Object.keys(groups).forEach(function (root) {
      var group = groups[root].sort(function (a, b) { return courseIndex(a) - courseIndex(b); });
      var kept = group.filter(function (code) { return appearsOn(plan, code, weekday); });
      var dropped = group.filter(function (code) { return kept.indexOf(code) === -1; });
      if (kept.length === 1) {
        var direct = dropped.filter(function (code) {
          return pairs.some(function (pair) {
            var a = pair[0].code;
            var b = pair[1].code;
            return (a === kept[0] && b === code) || (b === kept[0] && a === code);
          });
        });
        if (direct.length && direct.length === dropped.length) {
          lines.push(kept[0] + " overlaps " + joinNames(direct) + " on " + SINGULAR[weekday] + ". The plan keeps " + kept[0] + ".");
          return;
        }
      }
      var mentioned = {};
      pairs.forEach(function (pair) {
        if (find(pair[0].code) !== root) return;
        var key = pairKey(pair[0].code, pair[1].code);
        if (mentioned[key]) return;
        mentioned[key] = true;
        var keeper = keptCourse(plan, weekday, pair[0], pair[1]);
        lines.push(pair[0].code + " and " + pair[1].code + " overlap on " + SINGULAR[weekday] + ". The plan keeps " + keeper + ".");
      });
    });
    return lines;
  }

  function renderCards(selected, plan) {
    cardsEl.innerHTML = "";
    var unseen = unseenCourses(selected, plan);
    var conflictLines = [];
    var seenWalks = {};
    WEEKDAYS.forEach(function (weekday) {
      pairsForWeekday(selected, weekday).forEach(function (pair) {
        var between = walkBetween(pair[0], pair[1]);
        if (!between || between.slack >= 0) return;
        var key = pairKey(pair[0].code, pair[1].code);
        if (seenWalks[key]) return;
        seenWalks[key] = true;
        var info = between.info;
        conflictLines.push(info.first.code + " ends in " + info.first.building + " at " + formatTime(info.first.end) + ". " + info.second.code + " starts in " + info.second.building + " at " + formatTime(info.second.start) + ". You have " + info.gap + " minutes. The walk is " + between.minutes + ".");
        conflictLines.push(planSentence(plan, info.first.code, info.second.code));
      });
    });
    WEEKDAYS.forEach(function (weekday) {
      overlapLines(selected, plan, weekday).forEach(function (line) {
        conflictLines.push(line);
      });
    });

    if (unseen.length || conflictLines.length) {
      var bad = document.createElement("div");
      bad.className = "card bad";
      var badHeading = document.createElement("h3");
      badHeading.textContent = conflictLines.length ? "Conflict" : "Missing";
      bad.appendChild(badHeading);
      unseen.forEach(function (course) {
        addText(bad, "You never see " + course.code + ". Every meeting loses to another class.");
      });
      conflictLines.forEach(function (line) { addText(bad, line); });
      cardsEl.appendChild(bad);
    }

    var best = null;
    WEEKDAYS.forEach(function (weekday, weekdayIndex) {
      pairsForWeekday(selected, weekday).forEach(function (pair) {
        var between = walkBetween(pair[0], pair[1]);
        if (!between || between.slack < 0 || between.slack > 20) return;
        if (!best || between.slack < best.slack || (between.slack === best.slack && weekdayIndex < best.weekdayIndex)) {
          best = {
            slack: between.slack,
            weekdayIndex: weekdayIndex,
            info: between.info,
            minutes: between.minutes,
            courses: pair
          };
        }
      });
    });
    if (best) {
      var calm = document.createElement("div");
      calm.className = "card good";
      var goodHeading = document.createElement("h3");
      goodHeading.textContent = "Made it";
      calm.appendChild(goodHeading);
      var first = best.info.first;
      var second = best.info.second;
      var days = fittingDayNames(best.courses[0], best.courses[1]);
      addText(calm, "You can make " + second.code + ". " + first.code + " ends in " + first.building + " at " + formatTime(first.end) + " and " + second.code + " starts in " + second.building + " at " + formatTime(second.start) + " on " + days.join(" and ") + ". You have " + best.info.gap + " minutes, and the walk is " + best.minutes + ".");
      cardsEl.appendChild(calm);
    }
  }

  function showPlan() {
    planned = true;
    clearEntrance();
    var selected = selectedCourses();
    if (!selected.length) {
      statusEl.textContent = "Choose at least one class.";
      weeksEl.innerHTML = "";
      cardsEl.innerHTML = "";
      return;
    }
    var plan = buildPlan(selected);
    statusEl.textContent = week1Complete(selected, plan)
      ? "Week 1 gets you into every class once. Week 2 is the second look."
      : "Some classes still have to wait for week 2.";
    renderWeeks(plan);
    renderCards(selected, plan);
  }

  function reset() {
    planned = false;
    COURSES.forEach(function (course) { checked[course.code] = true; });
    clearEntrance();
    statusEl.textContent = "Pick the classes you might take, then plan the two weeks.";
    weeksEl.innerHTML = "";
    cardsEl.innerHTML = "";
    renderCourses();
  }

  document.getElementById("plan-btn").addEventListener("click", showPlan);
  document.getElementById("reset-btn").addEventListener("click", reset);
  renderCourses();
})();
</script>
</body>
</html>
